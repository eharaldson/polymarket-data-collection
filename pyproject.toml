[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polycollect"
version = "0.1.0"
description = "Record tick-by-tick Polymarket order book data for any market or event to Parquet."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Erik Haraldson" }]
keywords = ["polymarket", "prediction-markets", "orderbook", "market-data", "tick-data", "parquet", "websocket"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pyarrow>=14",
    "websockets>=14",  # connect(additional_headers=...) needs the new asyncio client
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
polycollect = "polycollect.cli:main"

[project.urls]
Homepage = "https://github.com/eharaldson/polymarket-data-collection"

[tool.setuptools.packages.find]
include = ["polycollect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
